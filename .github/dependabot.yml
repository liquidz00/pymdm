version: 2

# One weekly PR for all version updates across uv + GitHub Actions
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    # Multi-ecosystem groups skip security updates, so batch those per ecosystem
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
