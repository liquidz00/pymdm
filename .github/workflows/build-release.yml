name: Build, Release and Publish

on:
  workflow_dispatch:
    inputs:
      contributors:
        description: "Contributors for this release"
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, Release, and Publish to PyPi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Read release version
        id: read_version
        run: |
          VERSION=$(uv run python -c 'from pymdm import __version__; print(__version__)')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Check if tag exists
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ env.VERSION }}"; then
            echo "Tag v${{ env.VERSION }} already exists!"
            exit 1
          fi

      - name: Build distribution packages
        run: make build

      - name: Store distribution package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pymdm-${{ env.VERSION }}
          path: dist/

      - name: Publish package to PyPI
        id: publish_pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Get Changelog updates
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31  # v2.4.0
        with:
          validation_depth: 100
          version: v${{ env.VERSION }}

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@031a6408a9ad7fa6dcda49b7222ab2b54110a680  # v5.0.1
        continue-on-error: true  # don't block releases
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          reverse: 'true'

      - name: Create Release
        id: create_release
        if: ${{ steps.publish_pypi.outcome == 'success' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: pymdm ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./dist/*.tar.gz
            ./dist/*.whl
          body: |
            # Release Notes
            This release has been automatically generated by a GitHub Action.
            For detailed installation instructions, please refer to the [README](https://github.com/liquidz00/pymdm/blob/main/README.md).

            ## Changelog for this release
            This amended changelog is specific to this release. View the [full changelog](https://github.com/liquidz00/pymdm/blob/main/CHANGELOG.md) for all details.
            ${{ steps.changelog_reader.outputs.changes }}

            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Contributors
            ${{ github.event.inputs.contributors }}
